<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Learning Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 30px;
            background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
            border-radius: 14px;
            border: 1px solid #1e40af;
            box-shadow: 0 8px 32px rgba(30, 64, 175, 0.1);
        }

        h1 {
            color: #ffffff;
            font-size: 38px;
            margin-bottom: 10px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #a0aec0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .tagline {
            color: #60a5fa;
            font-size: 14px;
            margin-top: 10px;
            font-weight: 500;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 20px;
            padding-left: 15px;
            border-left: 4px solid #1e40af;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 35px;
        }

        .level-btn {
            padding: 18px 15px;
            border: 2px solid #2d3748;
            border-radius: 10px;
            background: #1a1a1a;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .level-btn:hover {
            border-color: #1e40af;
            background: #1e3a5f;
            box-shadow: 0 4px 16px rgba(30, 64, 175, 0.25);
            transform: translateY(-2px);
        }

        .level-btn.active {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            color: #ffffff;
            border-color: #1e40af;
            box-shadow: 0 6px 20px rgba(30, 64, 175, 0.4);
        }

        .level-btn-level {
            font-size: 14px;
            font-weight: 700;
        }

        .level-btn-name {
            font-size: 11px;
            margin-top: 6px;
            opacity: 0.85;
        }

        .level-info {
            background: #1a1a1a;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 30px;
            font-size: 14px;
            color: #cbd5e1;
            border-left: 4px solid #1e40af;
            border: 1px solid #2d3748;
            border-left: 4px solid #1e40af;
        }

        .level-info strong {
            color: #60a5fa;
        }

        .tasks-section {
            margin-bottom: 35px;
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .task-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #2d3748;
        }

        .task-card:hover {
            box-shadow: 0 12px 28px rgba(30, 64, 175, 0.25);
            border-color: #1e40af;
            transform: translateY(-6px);
            background: linear-gradient(135deg, #1e3a5f 0%, #1a2847 100%);
        }

        .task-icon {
            font-size: 42px;
            margin-bottom: 16px;
            color: #60a5fa;
        }

        .task-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .task-desc {
            font-size: 13px;
            color: #9ca3af;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
            border-radius: 16px;
            padding: 40px;
            max-width: 650px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(30, 64, 175, 0.3);
            border: 1px solid #2d3748;
        }

        .close-btn {
            float: right;
            font-size: 28px;
            font-weight: bold;
            color: #9ca3af;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            line-height: 1;
        }

        .close-btn:hover {
            color: #60a5fa;
        }

        .exercise-title {
            color: #ffffff;
            font-size: 24px;
            margin: 25px 0;
            clear: both;
            font-weight: 600;
        }

        .question {
            background: #1a1a1a;
            padding: 22px;
            border-radius: 10px;
            margin-bottom: 22px;
            font-size: 16px;
            color: #e2e8f0;
            border: 1px solid #2d3748;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 14px 18px;
            border: 2px solid #2d3748;
            border-radius: 10px;
            background: #1a1a1a;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            text-align: left;
            color: #e2e8f0;
        }

        .option:hover {
            border-color: #1e40af;
            background: #1e3a5f;
            color: #60a5fa;
        }

        .option.selected {
            background: #1e40af;
            color: #ffffff;
            border-color: #1e40af;
        }

        .option.correct {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }

        .option.incorrect {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 24px;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(30, 64, 175, 0.4);
            transform: translateY(-2px);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #2d3748;
            border-radius: 4px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1e40af 0%, #60a5fa 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .feedback {
            padding: 14px 18px;
            border-radius: 10px;
            margin-top: 18px;
            font-size: 14px;
            display: none;
            font-weight: 500;
        }

        .feedback.success {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            border: 1px solid #10b981;
            display: block;
        }

        .feedback.error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid #ef4444;
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px;
            margin-top: 40px;
            margin-bottom: 30px;
        }

        .stat-box {
            text-align: center;
            padding: 24px;
            background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
            border-radius: 12px;
            border: 1px solid #2d3748;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            border-color: #1e40af;
            box-shadow: 0 6px 20px rgba(30, 64, 175, 0.15);
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #60a5fa;
        }

        .stat-label {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 8px;
            font-weight: 500;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 30px 20px;
            border-top: 1px solid #2d3748;
            color: #6b7280;
            font-size: 13px;
        }

        .creator-credit {
            color: #60a5fa;
            font-weight: 600;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #2d3748;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #1e40af;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 English Mastery</h1>
            <p class="subtitle">От новичка к мастеру английского языка</p>
            <p class="tagline">Интерактивная платформа для всех уровней</p>
        </header>

        <div style="margin-bottom: 40px;">
            <div class="section-title">📚 Выбери свой уровень</div>
            <div class="levels-grid" id="levelsGrid"></div>
            <div class="level-info" id="levelInfo"></div>
        </div>

        <div class="tasks-section">
            <div class="section-title">✨ Доступные задания</div>
            <div class="tasks-grid" id="tasksGrid"></div>
        </div>

        <div style="margin-bottom: 30px;">
            <div class="section-title">📊 Твой прогресс</div>
            <div class="stats" id="stats">
                <div class="stat-box">
                    <div class="stat-number" id="completedCount">0</div>
                    <div class="stat-label">Завершено</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="accuracyCount">0%</div>
                    <div class="stat-label">Точность</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="streakCount">0</div>
                    <div class="stat-label">Серия</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="hoursCount">0h</div>
                    <div class="stat-label">Время учебы</div>
                </div>
            </div>
        </div>

        <footer>
            <p class="creator-credit">Created by Nardyio</p>
        </footer>
    </div>

    <div class="modal" id="exerciseModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div id="exerciseContainer"></div>
        </div>
    </div>

        let currentLevel = 'A1';
        let currentTask = null;
        let stats = { completed: 0, correct: 0, streak: 0, hours: 0 };
        let currentExerciseIndex = 0;

        function renderLevels() {
            const grid = document.getElementById('levelsGrid');
            grid.innerHTML = Object.keys(levels).map(level => `
                <button class="level-btn ${level === 'A1' ? 'active' : ''}" onclick="selectLevel('${level}')">
                    <div class="level-btn-level">${level}</div>
                    <div class="level-btn-name">${levels[level].name.split(' ')[1]}</div>
                </button>
            `).join('');
        }

        function selectLevel(level) {
            currentLevel = level;
            currentTask = null;
            currentExerciseIndex = 0;
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.level-btn').classList.add('active');
            
            document.getElementById('levelInfo').innerHTML = `
                <strong>📍 ${level} - ${levels[level].name.split(' ').slice(1).join(' ')}:</strong> ${levels[level].description}
            `;
            
            renderTasks();
        }

        function renderTasks() {
            const grid = document.getElementById('tasksGrid');
            grid.innerHTML = taskTypes.map((task, idx) => `
                <div class="task-card" onclick="startTask('${task.name}')">
                    <div class="task-icon">${task.icon}</div>
                    <div class="task-title">${task.name}</div>
                    <div class="task-desc">${task.desc}</div>
                </div>
            `).join('');
        }

        function startTask(taskName) {
            currentTask = taskName;
            currentExerciseIndex = 0;
            showExercise();
            document.getElementById('exerciseModal').classList.add('active');
        }

        function showExercise() {
            const exes = exercises[currentLevel][currentTask];
            if (!exes || exes.length === 0) {
                alert('Упражнения для этого задания еще подготавливаются!');
                return;
            }

            const exercise = exes[currentExerciseIndex];
            const progress = ((currentExerciseIndex + 1) / exes.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            const html = `
                <h2 class="exercise-title">${currentLevel} - ${currentTask}</h2>
                <div class="question">${exercise.q}</div>
                <div class="options" id="options"></div>
                <button class="btn-primary" onclick="nextExercise()">Далее →</button>
                <div class="feedback" id="feedback"></div>
            `;

            document.getElementById('exerciseContainer').innerHTML = html;

            const optionsDiv = document.getElementById('options');
            exercise.options.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = opt;
                btn.onclick = () => selectAnswer(idx, exercise.correct);
                optionsDiv.appendChild(btn);
            });
        }

        let selectedAnswer = null;

        function selectAnswer(idx, correct) {
            if (selectedAnswer !== null) return;
            
            selectedAnswer = idx;
            const options = document.querySelectorAll('.option');
            options[idx].classList.add(idx === correct ? 'correct' : 'incorrect');
            
            if (idx !== correct) {
                options[correct].classList.add('correct');
            }

            const feedback = document.getElementById('feedback');
            if (idx === correct) {
                feedback.textContent = '✓ Отлично!';
                feedback.classList.add('success');
                feedback.classList.remove('error');
                stats.correct++;
                stats.streak++;
            } else {
                feedback.textContent = '✗ Неправильно, попробуй еще!';
                feedback.classList.add('error');
                feedback.classList.remove('success');
                stats.streak = 0;
            }

            updateStats();
        }

        function nextExercise() {
            if (selectedAnswer === null) {
                alert('Пожалуйста, выбери ответ!');
                return;
            }

            currentExerciseIndex++;
            selectedAnswer = null;
            
            const exes = exercises[currentLevel][currentTask];
            if (currentExerciseIndex >= exes.length) {
                stats.completed++;
                stats.hours += 0.25;
                updateStats();
                closeModal();
                alert(`🎉 Отлично! Ты завершил "${currentTask}"\nПравильных ответов: ${stats.correct}/${exes.length}`);
                stats.correct = 0;
                return;
            }

            showExercise();
        }

        function updateStats() {
            document.getElementById('completedCount').textContent = stats.completed;
            document.getElementById('streakCount').textContent = stats.streak;
            document.getElementById('hoursCount').textContent = stats.hours.toFixed(1) + 'h';
            const accuracy = stats.completed > 0 ? Math.round((stats.correct / (stats.completed)) * 100) : 0;
            document.getElementById('accuracyCount').textContent = accuracy + '%';
        }

        function closeModal() {
            document.getElementById('exerciseModal').classList.remove('active');
            selectedAnswer = null;
            currentExerciseIndex = 0;
        }

        renderLevels();
        selectLevel('A1');
        updateStats();
    </script>
</body>
</html>
